<div class="media-upload-container">
  <div class="header">
    <div class="header-content">
      <h1>Media Upload</h1>
      <p class="version">Manage and upload your video assets</p>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Upload Files</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
        
        <!-- Dropzone Area -->
        <div class="dropzone" [class.has-files]="selectedFiles.length > 0">
          <input 
            type="file" 
            id="file-input"
            class="file-input"
            multiple
            (change)="onFileSelected($event)"
          >
          <div class="dz-content">
            <div class="upload-icon">☁️</div>
            <div class="dz-text">
              <label for="file-input" class="btn-link">Click to upload</label> or drag and drop
            </div>
            <div class="dz-hint">Supported formats: MP4, MOV, AVI (Max 500MB)</div>
          </div>
        </div>

        <!-- File List Table -->
        <div class="file-table-wrapper" *ngIf="selectedFiles.length > 0">
          <table class="file-table">
            <thead>
              <tr>
                <th>File Name</th>
                <th>Size</th>
                <th>Type</th>
                <th class="text-right">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let file of selectedFiles; let i = index">
                <td class="file-name">
                  <span class="file-icon">📄</span>
                  {{ file.name }}
                </td>
                <td class="file-size">{{ formatFileSize(file.size) }}</td>
                <td class="file-type">{{ file.type || 'Unknown' }}</td>
                <td class="text-right">
                  <button type="button" class="icon-btn delete" (click)="removeFile(i)" title="Remove file">
                    ✕
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Error Message -->
        <div class="alert alert-error" *ngIf="errorMessage">
          <span class="icon">⚠️</span>
          {{ errorMessage }}
        </div>

        <!-- Submit Action -->
        <div class="form-actions">
          <button 
            type="submit" 
            class="btn-primary"
            [disabled]="isSubmitting || selectedFiles.length === 0"
          >
            <span *ngIf="!isSubmitting">Upload {{ selectedFiles.length }} File{{ selectedFiles.length !== 1 ? 's' : '' }}</span>
            <span *ngIf="isSubmitting" class="loading-spinner">Uploading...</span>
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div class="toast-container" *ngIf="successMessage">
  <div class="toast success">
    <span class="icon">✓</span>
    <div class="toast-content">
      <div class="toast-title">Success</div>
      <div class="toast-message">{{ successMessage }}</div>
    </div>
    <button class="toast-close" (click)="successMessage = ''">✕</button>
  </div>
</div>
