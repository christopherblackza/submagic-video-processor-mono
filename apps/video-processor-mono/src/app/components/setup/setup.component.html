<div class="setup-container">
  <h1>Configuration</h1>
  <form [formGroup]="setupForm" (ngSubmit)="onConnect()" class="setup-form">
    <div class="form-group">
      <label for="apiKey">Submagic API Key</label>
      <input id="apiKey" type="password" formControlName="apiKey" class="form-control" placeholder="sk-..." />
      <div class="validation" *ngIf="setupForm.get('apiKey')?.touched && setupForm.get('apiKey')?.hasError('required')">API key is required</div>
    </div>
    <div class="error" *ngIf="error">{{ error }}</div>

  </form>
<div class="media-upload">
  <h2>Upload Media Library</h2>
  <form (submit)="uploadMedia($event)" class="upload-form">
    <div class="dropzone" [class.active]="dragActive" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
      <div class="dz-content">
        <div class="dz-text">Drag and drop files here</div>
        <div class="dz-actions">
          <button type="button" class="browse-btn" (click)="openFileDialog()">Browse Files</button>
        </div>
      </div>
      <input type="file" id="file-input" class="hidden-input" multiple (change)="onFileSelected($event)" />
    </div>
    <div class="selected-files" *ngIf="selectedFiles.length > 0">
      <div class="selected-header">Selected Files ({{ selectedFiles.length }})</div>
      <ul class="file-list">
        <li class="file-item" *ngFor="let file of selectedFiles; let i = index">
          <div class="file-meta">
            <span class="file-name">{{ file.name }}</span>
            <span class="file-size">{{ (file.size / 1024) | number:'1.0-1' }} KB</span>
          </div>
          <button type="button" class="remove-btn" (click)="removeFile(i)">Remove</button>
        </li>
      </ul>
      <div class="actions">
        <button type="button" class="clear-btn" (click)="clearFiles()">Clear</button>
      </div>
    </div>
    <div class="error" *ngIf="error">{{ error }}</div>
    <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="upload-actions">
      <button type="submit" class="primary submit-btn" [disabled]="uploading || selectedFiles.length === 0">
        <span *ngIf="!uploading">Upload Files</span>
        <span *ngIf="uploading">Uploading...</span>
      </button>
    </div>
  </form>
</div>


  <div class="next-cta">
    <button type="button" class="next-btn" (click)="proceedToUpload()" [disabled]="connecting">Next</button>
  </div>
</div>
