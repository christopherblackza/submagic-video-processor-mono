<div class="upload-container">
  <div class="page-header">
    <div class="header-title">
      <h1>Dashboard</h1>
      <p class="subtitle">Create new video projects</p>
    </div>
    <div class="header-actions">
      <button
        type="button"
        class="submit-btn"
        (click)="onSubmit()"
        [disabled]="isSubmitting || uploadForm.invalid"
      >
        <span *ngIf="!isSubmitting">Process</span>
        <span *ngIf="isSubmitting">Processing...</span>
      </button>
    </div>
  </div>
  
  <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="upload-form">
    <!-- Videos Section -->
    <div class="videos-card">
      <div class="card-header flex-between">
        <h2>1. Add Videos</h2>
        <button type="button" class="add-video-btn small" (click)="addVideo()">
          + Add Video
        </button>
      </div>

      <div class="card-body p-0">
        <div formArrayName="videos" class="videos-table">
          <div class="table-header">
            <div class="col-title">Title</div>
            <div class="col-url">Video URL</div>
            <div class="col-action"></div>
          </div>

          <div
            *ngFor="let video of videosArray.controls; let i = index"
            [formGroupName]="i"
            class="video-row"
          >
            <div class="col-title">
              <input
                type="text"
                [id]="'title-' + i"
                formControlName="title"
                class="form-control video-title"
                placeholder="Video Title"
              />
              <div class="error-text" *ngIf="isFieldInvalid('title', i)">
                Required
              </div>
            </div>

            <div class="col-url">
              <input
                type="url"
                [id]="'videoUrl-' + i"
                formControlName="videoUrl"
                class="form-control video-url"
                placeholder="https://..."
              />
              <div class="error-text" *ngIf="isFieldInvalid('videoUrl', i)">
                Required
              </div>
            </div>

            <div class="col-action">
              <button
                type="button"
                class="icon-btn remove"
                (click)="removeVideo(i)"
                *ngIf="videosArray.length > 1"
                title="Remove Video"
              >
                ✕
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Global Settings -->
    <div class="settings-card">
      <div class="card-header">
        <h2>2. Submagic Configuration</h2>
      </div>
      <div class="card-body">
        <div class="settings-grid">
          <div class="form-group">
            <label for="language">Language</label>
            <select
              id="language"
              formControlName="language"
              class="form-control compact"
            >
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
            </select>
          </div>

          <div class="form-group">
            <label for="templateName">Template</label>
            <select
              id="templateName"
              formControlName="templateName"
              class="form-control compact"
            >
              <ng-container *ngIf="templates?.length; else fallbackTemplates">
                <option *ngFor="let t of templates" [value]="t">{{ t }}</option>
              </ng-container>
              <ng-template #fallbackTemplates>
                <option value="Hormozi 2">Hormozi 2</option>
                <option value="MrBeast">MrBeast</option>
                <option value="Ali Abdaal">Ali Abdaal</option>
                <option value="Dan">Dan</option>
                <option value="Nema">Nema</option>
                <option value="Default">Default</option>
              </ng-template>
            </select>
          </div>

          <div class="form-group checkbox-wrapper">
            <label class="checkbox-label">
              <input type="checkbox" formControlName="magicZooms" />
              <span class="checkmark"></span>
              Magic Zooms
            </label>
          </div>

          <div class="form-group checkbox-wrapper">
            <label class="checkbox-label">
              <input type="checkbox" formControlName="magicBrolls" />
              <span class="checkmark"></span>
              Magic B-Rolls
            </label>
          </div>

            <div class="form-group checkbox-wrapper">
            <label class="checkbox-label">
              <input type="checkbox" formControlName="hookTitle" />
              <span class="checkmark"></span>
              Hook Title
            </label>
          </div>
        </div>

        <div class="dictionary-row">
          <div class="form-group full-width">
            <label for="dictionary"
              >Custom Dictionary <span class="optional">(Optional)</span></label
            >
            <input
              type="text"
              id="dictionary"
              formControlName="dictionary"
              class="form-control compact"
              placeholder="Enter custom words or phrases, separated by commas"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-message global-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </form>
</div>
