<div class="setup-container">
  <!-- <div class="page-header">
    <h1>System Setup</h1>
    <p class="subtitle">Configure your API keys and media library</p>
  </div> -->

  <div class="setup-grid">
    <!-- API Configuration Section -->
    <div class="card api-section">
      <div class="card-header">
        <h2>API Configuration</h2>
      </div>
      <div class="card-body">
        <div class="api-grid">
          <!-- OpenAI Key -->
          <div class="api-item" [class.active]="openaiKey">
            <div class="api-header">
              <div class="status-indicator">
                <span class="dot" [class.connected]="openaiKey"></span>
                <h3>OpenAI API</h3>
              </div>
              <button class="icon-btn delete" *ngIf="openaiKey" (click)="deleteKey('openai')" title="Delete Key">
                ✕
              </button>
            </div>
            
            <form [formGroup]="openaiForm" (ngSubmit)="saveKey('openai')" class="key-form">
              <div class="input-group">
                <input 
                  type="password" 
                  formControlName="keyValue" 
                  class="form-control compact" 
                  [placeholder]="openaiKey ? '••••••••••••••••' : 'sk-...'" 
                />
                <button type="submit" class="btn-action" [disabled]="openaiForm.invalid">
                  {{ openaiKey ? 'Update' : 'Save' }}
                </button>
              </div>
              <div class="meta-info" *ngIf="openaiKey?.last_used_at">
                Last used: {{ openaiKey!.last_used_at | date:'mediumDate' }}
              </div>
            </form>
          </div>

          <!-- Submagic Key -->
          <div class="api-item" [class.active]="submagicKey">
            <div class="api-header">
              <div class="status-indicator">
                <span class="dot" [class.connected]="submagicKey"></span>
                <h3>Submagic API</h3>
              </div>
              <button class="icon-btn delete" *ngIf="submagicKey" (click)="deleteKey('submagic')" title="Delete Key">
                ✕
              </button>
            </div>
            
            <form [formGroup]="submagicForm" (ngSubmit)="saveKey('submagic')" class="key-form">
              <div class="input-group">
                <input 
                  type="password" 
                  formControlName="keyValue" 
                  class="form-control compact" 
                  [placeholder]="submagicKey ? '••••••••••••••••' : 'submagic-...'" 
                />
                <button type="submit" class="btn-action" [disabled]="submagicForm.invalid">
                  {{ submagicKey ? 'Update' : 'Save' }}
                </button>
              </div>
               <div class="meta-info" *ngIf="submagicKey?.last_used_at">
                Last used: {{ submagicKey!.last_used_at | date:'mediumDate' }}
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>


  </div>

  <!-- Global Feedback -->
  <div class="feedback-toast" *ngIf="error || successMessage">
     <div class="toast error" *ngIf="error">{{ error }}</div>
     <div class="toast success" *ngIf="successMessage">{{ successMessage }}</div>
  </div>


</div>
