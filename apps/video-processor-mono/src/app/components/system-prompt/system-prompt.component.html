<div class="prompt-container">
  <div class="header-section">
    <div class="page-header">
      <h1>System Prompt</h1>
      <p class="subtitle">Configure the AI system prompt used for media matching.</p>
    </div>
    <div class="success-message" *ngIf="saved">
      <span class="icon">✓</span> Changes saved successfully
    </div>
  </div>

  <form [formGroup]="promptForm" (ngSubmit)="save()" class="prompt-form">
    <div class="editor-container">
      <textarea
        id="systemPrompt"
        formControlName="systemPrompt"
        class="code-editor"
        placeholder="Enter your system prompt..."
        spellcheck="false"
        (input)="onChange()"
      ></textarea>
    </div>

    <div class="actions-bar">
      <div class="status-text">
        <span *ngIf="promptForm.dirty" class="unsaved">● Unsaved changes</span>
      </div>
      <button type="submit" class="save-btn" [disabled]="saving || !promptForm.dirty">
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
