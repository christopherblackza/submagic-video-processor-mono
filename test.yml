version: 1
frontend:
  phases:
    preBuild:
      commands:
 	- npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Replace "web" with your Angular project name
        - npx nx build web --configuration production
  artifacts:
    baseDirectory: dist/apps/web
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*